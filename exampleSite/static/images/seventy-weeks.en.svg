<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' role='img' aria-label='The seventy weeks: the count with its two pauses, and the last week filled three times'><rect width='1000' height='600' rx='16' fill='#ffffff'/><text x='500' y='40' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#1f2328' text-anchor='middle' font-weight='700'>The seventy weeks</text><text x='500' y='68' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='middle' font-weight='400'>7 + 62 weeks with two pauses — and one week filled three times</text><text x='40' y='104' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>The count</text><line x1='112' y1='180' x2='312' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='180' x2='456' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='456' y1='180' x2='772' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='180' x2='912' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='112' y1='173' x2='112' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='173' x2='312' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='456' y1='173' x2='456' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='173' x2='772' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='912' y1='173' x2='912' y2='187' stroke='#1f2328' stroke-width='2.5'/><text x='112' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>588/587 BC</text><text x='112' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the word to rebuild</text><text x='112' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Jerusalem (Jer 30:18)</text><text x='312' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>539 BC</text><text x='312' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Cyrus, the anointed one,</text><text x='312' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>sends the exiles home</text><text x='456' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>c. 440 BC</text><text x='456' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Jerusalem stands again,</text><text x='456' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the walls under Nehemiah</text><text x='772' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>6 BC</text><text x='772' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Jesus is born</text><text x='912' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 27</text><text x='912' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the last week</text><text x='912' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>begins</text><text x='212.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>7 × 7 = 49 years</text><text x='384.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the count pauses</text><text x='384.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>about 100 years</text><text x='614.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>62 × 7 = 434 years</text><text x='842.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>pause</text><text x='842.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>about 30 years</text><text x='40' y='262' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>The last week, filled three times</text><rect x='290' y='323' width='560' height='14' rx='7' fill='#fbe3d4'/><line x1='290' y1='330' x2='850' y2='330' stroke='#d9692b' stroke-width='3'/><circle cx='290' cy='330' r='5.5' fill='#d9692b'/><circle cx='570' cy='330' r='5.5' fill='#d9692b'/><circle cx='850' cy='330' r='5.5' fill='#d9692b'/><text x='40' y='326' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#d9692b' text-anchor='start' font-weight='700'>Antiochus IV</text><text x='40' y='343' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>the first fulfilment</text><text x='290' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>171 BC</text><text x='290' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Onias III cut off</text><text x='570' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>Dec 167 BC</text><text x='570' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>sacrifice stops</text><text x='850' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>Dec 164 BC</text><text x='850' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the temple rededicated</text><text x='430.0' y='356' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#d9692b' text-anchor='middle' font-weight='400'>3½ years</text><text x='710.0' y='356' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#d9692b' text-anchor='middle' font-weight='400'>3½ years</text><rect x='290' y='403' width='560' height='14' rx='7' fill='#dcefd6'/><line x1='290' y1='410' x2='850' y2='410' stroke='#3f9a2c' stroke-width='3'/><circle cx='290' cy='410' r='5.5' fill='#3f9a2c'/><circle cx='570' cy='410' r='5.5' fill='#3f9a2c'/><circle cx='850' cy='410' r='5.5' fill='#3f9a2c'/><text x='40' y='406' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#3f9a2c' text-anchor='start' font-weight='700'>Jesus</text><text x='40' y='423' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>the week itself</text><text x='290' y='380' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 27</text><text x='290' y='395' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>baptised</text><text x='570' y='380' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 30</text><text x='570' y='395' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the cross</text><text x='850' y='380' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 34</text><text x='850' y='395' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Stephen is stoned</text><text x='430.0' y='436' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3f9a2c' text-anchor='middle' font-weight='400'>3½ years</text><text x='710.0' y='436' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#3f9a2c' text-anchor='middle' font-weight='400'>3½ years</text><rect x='290' y='483' width='560' height='14' rx='7' fill='#dde6ee'/><line x1='290' y1='490' x2='850' y2='490' stroke='#4a6b8a' stroke-width='3'/><circle cx='290' cy='490' r='5.5' fill='#4a6b8a'/><circle cx='570' cy='490' r='5.5' fill='#4a6b8a'/><circle cx='850' cy='490' r='5.5' fill='#4a6b8a'/><text x='40' y='486' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#4a6b8a' text-anchor='start' font-weight='700'>The Jewish war</text><text x='40' y='503' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>the same pattern, 40 years later</text><text x='290' y='460' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 66</text><text x='290' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the war begins</text><text x='570' y='460' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 70</text><text x='570' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the temple destroyed</text><text x='850' y='460' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>AD 73</text><text x='850' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>the war ends</text><text x='430.0' y='516' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4a6b8a' text-anchor='middle' font-weight='400'>3½ years</text><text x='710.0' y='516' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4a6b8a' text-anchor='middle' font-weight='400'>3½ years</text><line x1='40' y1='536' x2='960' y2='536' stroke='#c7cdd3' stroke-width='1'/><text x='40' y='562' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='start' font-weight='400'>The years are real years. What repeats is the pattern they carry.</text></svg>