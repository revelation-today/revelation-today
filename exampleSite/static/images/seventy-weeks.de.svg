<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' role='img' aria-label='Die siebzig Wochen: die Zählung mit ihren zwei Pausen und die letzte Woche, dreimal gefüllt'><rect width='1000' height='600' rx='16' fill='#ffffff'/><text x='500' y='40' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#1f2328' text-anchor='middle' font-weight='700'>Die siebzig Wochen</text><text x='500' y='68' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='middle' font-weight='400'>7 + 62 Wochen mit zwei Pausen — und eine Woche, dreimal gefüllt</text><text x='40' y='104' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>Die Zählung</text><line x1='112' y1='180' x2='312' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='180' x2='456' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='456' y1='180' x2='772' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='180' x2='912' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='112' y1='173' x2='112' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='173' x2='312' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='456' y1='173' x2='456' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='173' x2='772' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='912' y1='173' x2='912' y2='187' stroke='#1f2328' stroke-width='2.5'/><text x='112' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>588/587 v. Chr.</text><text x='112' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>das Wort, Jerusalem wieder</text><text x='112' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>aufzubauen (Jer 30,18)</text><text x='312' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>539 v. Chr.</text><text x='312' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Kyrus, der Gesalbte,</text><text x='312' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>lässt die Verbannten heim</text><text x='456' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>um 440 v. Chr.</text><text x='456' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Jerusalem steht wieder,</text><text x='456' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>die Mauern unter Nehemia</text><text x='772' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>6 v. Chr.</text><text x='772' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Jesus wird geboren</text><text x='912' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>27 n. Chr.</text><text x='912' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>die letzte Woche</text><text x='912' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>beginnt</text><text x='212.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>7 × 7 = 49 Jahre</text><text x='384.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>die Zählung pausiert</text><text x='384.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>etwa 100 Jahre</text><text x='614.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>62 × 7 = 434 Jahre</text><text x='842.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Pause</text><text x='842.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>etwa 30 Jahre</text><text x='40' y='262' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>Die letzte Woche, dreimal gefüllt</text><rect x='290' y='323' width='560' height='14' rx='7' fill='#fbe3d4'/><line x1='290' y1='330' x2='850' y2='330' stroke='#d9692b' stroke-width='3'/><circle cx='290' cy='330' r='5.5' fill='#d9692b'/><circle cx='570' cy='330' r='5.5' fill='#d9692b'/><circle cx='850' cy='330' r='5.5' fill='#d9692b'/><text x='40' y='326' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#d9692b' text-anchor='start' font-weight='700'>Antiochus IV.</text><text x='40' y='343' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>die erste Erfüllung</text><text x='290' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'