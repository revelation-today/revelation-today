amily='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>66 n. Chr.</text><text x='290' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>der Krieg beginnt</text><text x='570' y='460' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>70 n. Chr.</text><text x='570' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>der Tempel zerstört</text><text x='850' y='460' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>73 n. Chr.</text><text x='850' y='475' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>der Krieg endet</text><text x='430.0' y='516' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4a6b8a' text-anchor='middle' font-weight='400'>3½ Jahre</text><text x='710.0' y='516' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4a6b8a' text-anchor='middle' font-weight='400'>3½ Jahre</text><line x1='40' y1='536' x2='960' y2='536' stroke='#c7cdd3' stroke-width='1'/><text x='40' y='562' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='start' font-weight='400'>Die Jahre sind wirkliche Jahre. Was sich wiederholt, ist das Muster, das sie tragen.</text></svg>