<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' role='img' aria-label='Ketujuh puluh minggu: hitungan dengan dua jedanya, dan minggu terakhir yang diisi tiga kali'><rect width='1000' height='600' rx='16' fill='#ffffff'/><text x='500' y='40' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#1f2328' text-anchor='middle' font-weight='700'>Ketujuh puluh minggu</text><text x='500' y='68' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='middle' font-weight='400'>7 + 62 minggu dengan dua jeda — dan satu minggu yang diisi tiga kali</text><text x='40' y='104' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>Hitungannya</text><line x1='112' y1='180' x2='312' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='180' x2='456' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='456' y1='180' x2='772' y2='180' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='180' x2='912' y2='180' stroke='#c7cdd3' stroke-width='2.5' stroke-dasharray='5 7'/><line x1='112' y1='173' x2='112' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='312' y1='173' x2='312' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='456' y1='173' x2='456' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='772' y1='173' x2='772' y2='187' stroke='#1f2328' stroke-width='2.5'/><line x1='912' y1='173' x2='912' y2='187' stroke='#1f2328' stroke-width='2.5'/><text x='112' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>588/587 SM</text><text x='112' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>firman untuk membangun</text><text x='112' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>kembali Yerusalem (Yer 30:18)</text><text x='312' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>539 SM</text><text x='312' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Koresh, yang diurapi,</text><text x='312' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>memulangkan buangan</text><text x='456' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>sekitar 440 SM</text><text x='456' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Yerusalem berdiri lagi,</text><text x='456' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>tembok di bawah Nehemia</text><text x='772' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>6 SM</text><text x='772' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Yesus lahir</text><text x='912' y='126' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#1f2328' text-anchor='middle' font-weight='700'>27 M</text><text x='912' y='144' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>minggu terakhir</text><text x='912' y='159' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>dimulai</text><text x='212.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>7 × 7 = 49 tahun</text><text x='384.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>hitungan berhenti</text><text x='384.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>sekitar 100 tahun</text><text x='614.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' text-anchor='middle' font-weight='700'>62 × 7 = 434 tahun</text><text x='842.0' y='202' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>jeda</text><text x='842.0' y='218' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#5b636b' text-anchor='middle' font-weight='400'>sekitar 30 tahun</text><text x='40' y='262' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>Minggu terakhir, diisi tiga kali</text><rect x='290' y='323' width='560' height='14' rx='7' fill='#fbe3d4'/><line x1='290' y1='330' x2='850' y2='330' stroke='#d9692b' stroke-width='3'/><circle cx='290' cy='330' r='5.5' fill='#d9692b'/><circle cx='570' cy='330' r='5.5' fill='#d9692b'/><circle cx='850' cy='330' r='5.5' fill='#d9692b'/><text x='40' y='326' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#d9692b' text-anchor='start' font-weight='700'>Antiokhus IV</text><text x='40' y='343' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>penggenapan pertama</text><text x='290' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>171 SM</text><text x='290' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Onias III disingkirkan</text><text x='570' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>Des 167 SM</text><text x='570' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>kurban berhenti</text><text x='850' y='300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>Des 164 SM</text><text x='850' y='315' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='middle' font-weight='400'>bait ditahbiskan kembali</text><text x='430.0' y='356' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#d9692b' text-anchor='middle' font-weight='400'>3½ tahun</text><text x='710.0' y='356' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#d9692b' text-anchor='middle' font-weight='400'>3½ tahun</text><rect x='290' y='403' width='560' height='14' rx='7' fill='#dcefd6'/><line x1='290' y1='410' x2='850' y2='410' stroke='#3f9a2c' stroke-width='3'/><circle cx='290' cy='410' r='5.5' fill='#3f9a2c'/><circle cx='570' cy='410' r='5.5' fill='#3f9a2c'/><circle cx='850' cy='410' r='5.5' fill='#3f9a2c'/><text x='40' y='406' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#3f9a2c' text-anchor='start' font-weight='700'>Yesus</text><text x='40' y='423' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>minggu itu sendiri</text><text x='290' y='380' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size=