<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 545' role='img' aria-label='Was er behauptet — etwas größer als Gott'><rect width='1000' height='545' rx='16' fill='#ffffff'/><text x='500.0' y='40.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='26' fill='#1f2328' text-anchor='middle' font-weight='700'>Was er behauptet — etwas größer als Gott</text><text x='500.0' y='68.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='middle' font-weight='400'>Jedes Mal liegt die Zahl des Tieres knapp über der Gottes</text><rect x='90' y='166.7' width='100' height='233.3' rx='6' fill='#3f9a2c'/><text x='140.0' y='154.7' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#3f9a2c' text-anchor='middle' font-weight='700'>7</text><text x='140.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Gottes Sieben</text><rect x='220' y='133.3' width='100' height='266.7' rx='6' fill='#d9692b'/><text x='270.0' y='121.3' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#d9692b' text-anchor='middle' font-weight='700'>8</text><text x='270.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>„ein achter“</text><text x='270.0' y='438.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>(17,11)</text><line x1='75' y1='400' x2='335' y2='400' stroke='#d5d9dd' stroke-width='2'/><rect x='400' y='139.5' width='100' height='260.5' rx='6' fill='#3f9a2c'/><text x='450.0' y='127.5' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#3f9a2c' text-anchor='middle' font-weight='700'>1260</text><text x='450.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>die Tage der</text><text x='450.0' y='438.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Gemeinde</text><rect x='530' y='133.3' width='100' height='266.7' rx='6' fill='#d9692b'/><text x='580.0' y='121.3' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#d9692b' text-anchor='middle' font-weight='700'>1290</text><text x='580.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Daniels Tage</text><text x='580.0' y='438.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>(Dan 12,11)</text><line x1='385' y1='400' x2='645' y2='400' stroke='#d5d9dd' stroke-width='2'/><rect x='710' y='147.9' width='100' height='252.1' rx='6' fill='#3f9a2c'/><text x='760.0' y='135.9' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#3f9a2c' text-anchor='middle' font-weight='700'>1225</text><text x='760.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Gottes Quadrat</text><rect x='840' y='133.3' width='100' height='266.7' rx='6' fill='#d9692b'/><text x='890.0' y='121.3' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#d9692b' text-anchor='middle' font-weight='700'>1296</text><text x='890.0' y='422.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>das nächste</text><text x='890.0' y='438.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Quadrat des</text><text x='890.0' y='454.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#5b636b' text-anchor='middle' font-weight='400'>Tieres</text><line x1='695' y1='400' x2='955' y2='400' stroke='#d5d9dd' stroke-width='2'/><text x='500.0' y='504.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Beobachtung dieser Seite.</text><text x='500.0' y='522.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#5b636b' text-anchor='middle' font-weight='400'>Die Himmelfahrt des Jesaja gibt dem Antichristen 1332 Tage, das mit 666 verbundene Rechteck (Bauckham, Climax of Prophecy, 403).</text></svg>