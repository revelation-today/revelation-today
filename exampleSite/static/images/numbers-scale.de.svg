<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' role='img' aria-label='Was er ist — zwei Grundzahlen, gleich gebaut'><rect width='1000' height='600' rx='16' fill='#ffffff'/><text x='500.0' y='40.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='25' fill='#1f2328' text-anchor='middle' font-weight='700'>Was er ist — zwei Grundzahlen, gleich gebaut</text><text x='500.0' y='68.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='middle' font-weight='400'>Das Tier baut auf 6, Gottes Volk auf 35 — dieselben Schritte, eine immer größere Kluft</text><text x='105.0' y='100.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#5b636b' text-anchor='middle' font-weight='700'></text><text x='240.0' y='100.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#d9692b' text-anchor='middle' font-weight='700'>das Tier</text><text x='375.0' y='100.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#3f9a2c' text-anchor='middle' font-weight='700'>Gottes Volk</text><text x='525.0' y='100.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#5b636b' text-anchor='middle' font-weight='700'>Verhältnis</text><rect x='184' y='122' width='112' height='52' rx='8' fill='#fbe3d4'/><rect x='304' y='122' width='142' height='52' rx='8' fill='#dcefd6'/><text x='34.0' y='153.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='start' font-weight='400'>Grundzahl</text><text x='240.0' y='153.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#d9692b' text-anchor='middle' font-weight='700'>6</text><text x='375.0' y='153.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#3f9a2c' text-anchor='middle' font-weight='700'>35</text><text x='458.0' y='153.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' text-anchor='start' font-weight='700'>≈ 6</text><rect x='184' y='184' width='112' height='52' rx='8' fill='#fbe3d4'/><rect x='304' y='184' width='142' height='52' rx='8' fill='#dcefd6'/><text x='34.0' y='215.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='start' font-weight='400'>Quadrat = Dreieck</text><text x='240.0' y='215.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#d9692b' text-anchor='middle' font-weight='700'>36 = 1+…+8</text><text x='375.0' y='215.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#3f9a2c' text-anchor='middle' font-weight='700'>1225 = 1+…+49</text><text x='458.0' y='215.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' text-anchor='start' font-weight='700'>≈ 34</text><rect x='184' y='246' width='112' height='52' rx='8' fill='#fbe3d4'/><rect x='304' y='246' width='142' height='52' rx='8' fill='#dcefd6'/><text x='34.0' y='277.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='start' font-weight='400'>Rechteck = Zeit</text><text x='240.0' y='277.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#d9692b' text-anchor='middle' font-weight='700'>42 Monate</text><text x='375.0' y='277.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#3f9a2c' text-anchor='middle' font-weight='700'>1260 Tage</text><text x='458.0' y='269.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#5b636b' text-anchor='start' font-weight='700'>30</text><text x='458.0' y='289.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#5b636b' text-anchor='start' font-weight='400'>dieselben 3½ Jahre</text><rect x='184' y='308' width='112' height='52' rx='8' fill='#fbe3d4'/><rect x='304' y='308' width='142' height='52' rx='8' fill='#dcefd6'/><text x='34.0' y='331.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='start' font-weight='400'>Dreieck über dem</text><text x='34.0' y='347.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='start' font-weight='400'>Quadrat</text><text x='240.0' y='339.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#d9692b' text-anchor='middle' font-weight='700'>666</text><text x='375.0' y='339.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#3f9a2c' text-anchor='middle' font-weight='700'>750.925</text><text x='458.0' y='339.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' text-anchor='start' font-weight='700'>≈ 1.128</text><polygon points='620,425.78 950,425.78 785.0,140' fill='#3f9a2c' opacity='0.9'/><polygon points='580,425.78 589.6979591836734,425.78 584.8489795918367,417.38156734693877' fill='#d9692b'/><line x1='584.8489795918367' y1='412.38156734693877' x2='584.8489795918367' y2='375.78' stroke='#d9692b' stroke-width='1.5'/><text x='584.8' y='367.8' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#d9692b' text-anchor='middle' font-weight='700'>666</text><text x='785.0' y='328.6' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='26' fill='#ffffff' text-anchor='middle' font-weight='700'>750.925</text><text x='500.0' y='528.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14.5' fill='#1f2328' text-anchor='middle' font-weight='400'>Jeder Schritt nimmt die Zahl mit sich selbst mal, darum wächst die Kluft: 6, dann 34, dann über 1.100.</text><text x='500.0' y='552.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#5b636b' text-anchor='middle' font-weight='400'>Nur die Zeit ist gemeinsam — 42 Monate sind 1260 Tage. Wäre Gottes Seite 2 m groß, wäre die des Tieres kleiner als 2 mm.</text></svg>