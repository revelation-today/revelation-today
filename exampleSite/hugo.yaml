# Configuration
baseURL: "https://revelation-today.net/"
title: "The Book of Revelation"

timeout: 300000

enableRobotsTXT: true
enableGitInfo: true
# enableEmoji: false
hasCJKLanguage: true

# services:
#   googleAnalytics:
#     ID: G-MEASUREMENT_ID

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

taxonomies:
  theme: themes

defaultContentLanguage: en
languages:
  de:
    languageName: Deutsch
    weight: 10
    title: Das Buch Offenbarung
    menus:
      main:
        - identifier: home
          name: Start
          params:
            icon: home
          pageRef: /
          weight: 1
        - identifier: help
          name: Hilfe
          pageRef: /help
          params:
            type: help
          weight: 11
        - name: Suche
          weight: 12
          params:
            type: search
      sidebar:
        - identifier: about
          name: "Über"
          pageRef: "/about"
          weight: 4
  en:
    languageName: English
    weight: 20
    title: The Book of Revelation
    menus:
      main:
        - identifier: home
          name: Home
          params:
            icon: home
          pageRef: /
          weight: 1
        - identifier: help
          name: Help
          pageRef: /help
          params:
            type: help
          weight: 11
        - name: Search
          weight: 12
          params:
            type: search
      sidebar:
        - identifier: about
          name: "About"
          pageRef: "/about"
          weight: 4
  id:
    languageName: Bahasa Indonesia
    weight: 30
    title: Kitab Wahyu
    menus:
      main:
        - identifier: home
          name: Beranda
          params:
            icon: home
          pageRef: /
          weight: 1
        - identifier: help
          name: Bantuan
          pageRef: /help
          params:
            type: help
          weight: 11
        - name: Cari
          weight: 12
          params:
            type: search
      sidebar:
        - identifier: about
          name: "Tentang"
          pageRef: "/about"
          weight: 4
  tr:
    languageName: Türkçe
    weight: 40
    title: Vihay
    menus:
      main:
        - identifier: home
          name: Ana Sayfa
          params:
            icon: home
          pageRef: /
          weight: 1
        - identifier: help
          name: Yardım
          pageRef: /help
          params:
            type: help
          weight: 11
        - name: Ara
          weight: 12
          params:
            type: search
      sidebar:
        - identifier: about
          name: "Hakkında"
          pageRef: "/about"
          weight: 4

module:
  hugoVersion:
    extended: true
    min: "0.112.0"

  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

params:
  description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      # width: 40
      # height: 20
      # link: /
    width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/revelation-today/revelation-today/blob/main/exampleSite/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

  comments:
    enable: false
    type: giscus

    # https://giscus.app/
    giscus:
      repo: revelation-today
      repoId: R_kgDOJ9fJag
      category: General
      categoryId: DIC_kwDOJ9fJas4CY7gW
      # mapping: pathname
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      # inputPosition: top
      # lang: en
