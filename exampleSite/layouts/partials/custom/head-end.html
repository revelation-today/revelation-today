{{- /* Served from the site rather than a CDN: one third party fewer for readers,
       and the offline app keeps it with everything else. */ -}}
{{- $quicklink := resources.Get "lib/quicklink/quicklink.umd.js" | fingerprint }}
<script src="{{ $quicklink.RelPermalink }}" integrity="{{ $quicklink.Data.Integrity }}"></script>
<script>
  window.addEventListener("load", () => {
    if (window.quicklink) quicklink.listen();
  });
</script>
{{ partial "custom/analytics.html" . }}
